name: billing-main

on:
    push:
        branches:  [main , master ]
jobs:

    build-and-push:
        name: Build & push Docker image
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v2
              with:
                registry: ghcr.io
                username: ${{secrets.GHCR_USER}}
                password: ${{secrets.GHCR_TOKEN}}
            - name: Build Docker image
              run: |
                  docker build -t ghcr.io/${{ github.repository_owner }}/${{secrets.DOCKER_IMAGE_NAME}}:${{ github.sha }} .
                  docker push ghcr.io/${{ github.repository_owner }}/${{secrets.DOCKER_IMAGE_NAME}}:${{ github.sha }}

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Deploy on server
              uses: D3rHase/ssh-command-action@v0.2.2
              with:
                    host: ${{secrets.SERVER_IP}}
                    user: ${{secrets.SSH_USER}}
                    private_key: ${{secrets.SSH_KEY}}
                    command: |
                        docker login ghcr.io -u ${{ secrets.GHCR_USER }} -p ${{ secrets.GHCR_TOKEN }};
                        docker pull ghcr.io/${{ github.repository_owner }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }};
                        docker stop ${{secrets.DOCKER_CONTAINER_NAME}};
                        docker rm ${{secrets.DOCKER_CONTAINER_NAME}};
                        docker run -p 5000:3000 -d --name ${{secrets.DOCKER_CONTAINER_NAME}} ghcr.io/${{ github.repository_owner }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }};