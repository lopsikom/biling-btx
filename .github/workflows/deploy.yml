name: billing

on:
    push:
        branches:
            - 'main'
jobs:

    build-and-push:
        name: Build & push Docker image
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v2
              with:
                registry: ghcr.io
                username: ${{secrets.GHCR_USER}}
                password: ${{secrets.GHCR_TOKEN}}
            - name: Build Docker image
              run: |
                  docker build --build-arg NUXT_DATABASE_URL="${{secrets.DATABASE_URL}}" \
                  --build-arg NUXT_AUTH_URI="${{secrets.AUTH_URI}}" \
                  --build-arg NUXT_PUBLIC_BASE_URL="${{secrets.BASE_URL}}" \
                  --build-arg NUXT_PUBLIC_BASE_URI="${{secrets.BASE_URI}}" \
                  --build-arg NUXT_REDIS_URL="${{secrets.REDIS_URL}}" \
                  --target prod \
                  -t ghcr.io/${{ github.repository_owner }}/${{secrets.DOCKER_IMAGE_NAME}}:${{ github.sha }} .
                  docker push ghcr.io/${{ github.repository_owner }}/${{secrets.DOCKER_IMAGE_NAME}}:${{ github.sha }}

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Deploy on server
              uses: D3rHase/ssh-command-action@v0.2.2
              with:
                    host: ${{secrets.SERVER_IP}}
                    user: ${{secrets.SSH_USER}}
                    private_key: ${{secrets.SSH_KEY}}
                    command: |
                        docker login ghcr.io -u ${{ secrets.GHCR_USER }} -p ${{ secrets.GHCR_TOKEN }};
                        docker pull ghcr.io/${{ github.repository_owner }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }};
                        docker stop redis-prod;
                        docker rm redis-prod;
                        docker run -d --name redis-prod --network billing_network-prod --restart unless-stopped --memory 256m redis redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru;
                        docker stop ${{secrets.DOCKER_CONTAINER_NAME}};
                        docker rm ${{secrets.DOCKER_CONTAINER_NAME}};
                        mkdir -p /var/log/billing-prod;
                        docker run -p 5000:3000 --network billing_network-prod -v /var/log/billing-prod:/app/logs -d --restart unless-stopped --memory 1g -e NODE_OPTIONS=--max-old-space-size=768 --name ${{secrets.DOCKER_CONTAINER_NAME}} ghcr.io/${{ github.repository_owner }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }};
